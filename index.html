<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Apresentação TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1e293b;
            border-bottom: 2px solid #334155;
        }
        header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .header-info {
            display: flex;
            gap: 20px;
            font-size: 1rem;
            color: #94a3b8;
        }

        /* ÁREA DAS TELAS */
        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .tela {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .tela.ativa {
            opacity: 1;
            visibility: visible;
        }

        /* TELA 1: TABELA / PAINEL DADOS */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .card-dado {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card-dado h3 {
            color: #38bdf8;
            font-size: 1.6rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .metrica {
            margin: 12px 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
        }
        .metrica span {
            color: #94a3b8;
        }
        .metrica strong {
            color: #f8fafc;
        }

        /* TELAS IMAGENS / BRINDES */
        .container-midia {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            max-width: 90%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .container-midia h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #facc15;
            text-align: center;
            white-space: pre-line; /* Garante que \n vire quebra de linha visual */
        }
        .container-midia img {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 8px;
        }

        /* FOOTER / INDICADORES */
        footer {
            height: 30px;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
        }
        .ponto {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #334155;
            transition: background 0.3s, transform 0.3s;
        }
        .ponto.ativo {
            background: #38bdf8;
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>PAINEL OPERACIONAL</h1>
        <div class="header-info">
            <div id="dataAtual">--/--/----</div>
            <div>Última Atualização: <strong id="ultimaAtualizacao">--:--</strong></div>
        </div>
    </header>

    <main id="containerTelas">
        <!-- Tela 1: Dados numéricos do painel.xlsx -->
        <div class="tela ativa" id="tela-dados">
            <div class="grid-cards" id="gridDados">
                <!-- Injetado dinamicamente via JS -->
            </div>
        </div>

        <!-- As demais telas de imagens serão injetadas dinamicamente aqui -->
    </main>

    <footer>
        <div id="indicadorTelas"></div>
    </footer>

    <script>
        /* =========================================================================
           1. VARIÁVEIS INJETADAS PELO PYTHON (NÃO ALTERAR A ESTRUTURA)
           ========================================================================= */
        const dadosEntrada = [
    {
        "faixa": "60 dias",
        "meta": 3500,
        "realizado": 1606,
        "projecao": 3375
    },
    {
        "faixa": "90 dias",
        "meta": 2500,
        "realizado": 896,
        "projecao": 2449
    },
    {
        "faixa": "120 dias",
        "meta": 1200,
        "realizado": 495,
        "projecao": 1199
    }
];
        const imagensBrindes = [
    {
        "titulo": "QUE ESTE NOVO CICLO SEJA REPLETO DE REALIZAÇÕES. FELIZ ANIVERSÁRIO!",
        "src": "https://i.postimg.cc/QxgqtZmG/aniversariantes-do-mes.png"
    },
    {
        "titulo": "FECHAMENTO DE OURO",
        "src": "https://i.postimg.cc/QdyKNf2Z/Fechamento-de-Ouro.png"
    },
    {
        "titulo": "O GRANDE PÓDIO",
        "src": "https://i.postimg.cc/zv8V26gN/O-grade-Podio.png"
    },
    {
        "titulo": "PREMIAÇÃO MENSAL  100%",
        "src": "https://i.postimg.cc/Xq4p1mCd/Premiacao-Mensal-100.png"
    },
    {
        "titulo": "PREMIAÇÃO MENSAL 90% A 99%",
        "src": "https://i.postimg.cc/8c4s24RK/Premiacao-Mensal-90-a-99.png"
    }
];

        /* =========================================================================
           2. RENDERIZAÇÃO DA TELA 1 (DADOS DO PAINEL)
           ========================================================================= */
        function renderizarTela1() {
            const grid = document.getElementById("gridDados");
            grid.innerHTML = "";

            if (!dadosEntrada || dadosEntrada.length === 0) {
                grid.innerHTML = `<div class="card-dado" style="grid-column: span 3;"><h3>SEM DADOS PARA EXIBIR</h3></div>`;
                return;
            }

            dadosEntrada.forEach(item => {
                const card = document.createElement("div");
                card.className = "card-dado";
                card.innerHTML = `
                    <h3>${item.faixa}</h3>
                    <div class="metrica"><span>Meta:</span> <strong>R$ ${item.meta.toLocaleString('pt-BR')}</strong></div>
                    <div class="metrica"><span>Realizado:</span> <strong>R$ ${item.realizado.toLocaleString('pt-BR')}</strong></div>
                    <div class="metrica"><span>Projeção:</span> <strong>R$ ${item.projecao.toLocaleString('pt-BR')}</strong></div>
                `;
                grid.appendChild(card);
            });
        }

        /* =========================================================================
           3. GERADOR DAS TELAS DE IMAGENS / BRINDES
           ========================================================================= */
        function gerarTelasImagens() {
            const container = document.getElementById("containerTelas");

            imagensBrindes.forEach((brinde, index) => {
                const divTela = document.createElement("div");
                divTela.className = "tela";
                divTela.id = `tela-brinde-${index}`;
                divTela.innerHTML = `
                    <div class="container-midia">
                        <h2>${brinde.titulo}</h2>
                        <img src="${brinde.src}" alt="Brinde/Comunicado" onerror="this.src='https://via.placeholder.com/800x450?text=Imagem+N%C3%A3o+Encontrada'">
                    </div>
                `;
                container.appendChild(divTela);
            });
        }

        /* =========================================================================
           4. ROTAÇÃO DE TELAS COM TEMPOS DINÂMICOS
           ========================================================================= */
        let telaAtual = 0;
        let telas = [];
        let pontos = [];
        let timerRotacao = null;

        function criarIndicadores() {
            telas = document.querySelectorAll(".tela");
            const containerIndicadores = document.getElementById("indicadorTelas");
            containerIndicadores.innerHTML = "";

            telas.forEach((_, i) => {
                const ponto = document.createElement("div");
                ponto.className = `ponto ${i === 0 ? 'ativo' : ''}`;
                containerIndicadores.appendChild(ponto);
            });

            pontos = document.querySelectorAll(".ponto");
        }

        function alternarTela() {
            if (telas.length === 0) return;

            // Oculta a tela e ponto atuais
            telas[telaAtual].classList.remove("ativa");
            if (pontos[telaAtual]) pontos[telaAtual].classList.remove("ativo");

            // Incrementa o índice
            telaAtual = (telaAtual + 1) % telas.length;

            // Exibe a nova tela e ponto
            telas[telaAtual].classList.add("ativa");
            if (pontos[telaAtual]) pontos[telaAtual].classList.add("ativo");

            // Agenda a próxima transição com base na nova tela
            agendarProximaTroca();
        }

        function agendarProximaTroca() {
            if (timerRotacao) clearTimeout(timerRotacao);

            // TELA 1 (índice 0): 50 segundos (50000ms)
            // OUTRAS TELAS: 12 segundos (12000ms)
            const tempoEspera = (telaAtual === 0) ? 50000 : 12000;

            timerRotacao = setTimeout(alternarTela, tempoEspera);
        }

        function atualizarData() {
            const agora = new Date();
            document.getElementById("dataAtual").innerText = agora.toLocaleDateString("pt-BR", {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }

        /* =========================================================================
           5. INICIALIZAÇÃO
           ========================================================================= */
        function init() {
            atualizarData();
            renderizarTela1();
            gerarTelasImagens();
            criarIndicadores();
            document.getElementById("ultimaAtualizacao").innerText = new Date().toLocaleTimeString("pt-BR", { hour: '2-digit', minute: '2-digit' });

            // Inicia o ciclo dinâmico
            agendarProximaTroca();
        }

        window.onload = init;
    </script>
</body>
</html>
