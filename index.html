<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento e Aniversariantes - TV</title>

<style>
:root {
    --azul-escuro: #0a192f;
    --azul-card: #112240;
    --azul-hover: #1d3557;
    --azul-destaque: #0077b6;
    --cyan: #00f5d4;
    --verde: #2ec4b6;
    --vermelho: #e63946;
    --amarelo: #ffb703;
    --cinza-texto: #8892b0;
    --branco: #f8f9fa;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--azul-escuro);
    color: var(--branco);
    overflow: hidden;
}

/* ==========================================
   ROTAÇÃO E TRANSIÇÃO DE TELAS
   ========================================== */
.tela {
    display: none;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    padding: 30px;
    width: 100vw;
    height: 100vh;
}

.tela.ativa {
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 1;
}

.indicador-telas {
    position: fixed;
    top: 20px;
    right: 25px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
}

.ponto {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
}

.ponto.ativo {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
}

/* ==========================================
   ESTILOS - TELA 1 (DASHBOARD REDESENHADO)
   ========================================== */
.header-tv {
    text-align: center;
    margin-bottom: 25px;
}

.header-tv h1 {
    font-size: clamp(28px, 2.5vw, 44px);
    margin: 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header-tv .sub {
    font-size: clamp(14px, 1.2vw, 22px);
    color: var(--cinza-texto);
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 30px;
}

.header-tv .sub span {
    color: var(--amarelo);
    font-weight: bold;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1700px;
    margin: 0 auto;
    width: 100%;
}

.card-faixa {
    background: var(--azul-card);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.card-faixa::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, var(--azul-destaque), var(--cyan));
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 12px;
    margin-bottom: 15px;
}

.card-header .titulo {
    font-size: clamp(22px, 1.8vw, 30px);
    font-weight: 800;
    color: var(--branco);
}

.card-header .meta-badge {
    background: rgba(255,255,255,0.06);
    padding: 6px 14px;
    border-radius: 12px;
    font-size: clamp(12px, 1vw, 16px);
    color: var(--cinza-texto);
}

.card-header .meta-badge strong {
    color: var(--branco);
}

/* BLANCOS DE RESULTADOS PRINCIPAIS */
.metricas-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

.metrica-box {
    background: rgba(0,0,0,0.25);
    padding: 15px;
    border-radius: 14px;
    text-align: center;
}

.metrica-box .rotulo {
    font-size: clamp(11px, 0.85vw, 14px);
    color: var(--cinza-texto);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}

.metrica-box .valor {
    font-size: clamp(22px, 2vw, 34px);
    font-weight: 800;
}

.metrica-box .pct {
    font-size: clamp(12px, 0.9vw, 16px);
    font-weight: bold;
    margin-top: 4px;
}

/* CORES DINÂMICAS DE STATUS */
.status-negativo { color: var(--vermelho); }
.status-positivo { color: var(--verde); }

/* BARRAS DE PROGRESSO */
.progresso-container {
    margin-bottom: 15px;
}

.progresso-rotulo {
    display: flex;
    justify-content: space-between;
    font-size: clamp(11px, 0.85vw, 14px);
    color: var(--cinza-texto);
    margin-bottom: 6px;
}

.barra-bg {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
}

.barra-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 1s ease-in-out;
}

.barra-fill.realizado { background: linear-gradient(90deg, #3a86ff, #00f5d4); }
.barra-fill.projecao { background: linear-gradient(90deg, #ffb703, #fb8500); }

/* FOOTER DO CARD (SALDOS) */
.card-footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    padding: 12px;
    border-radius: 12px;
    font-size: clamp(11px, 0.85vw, 14px);
}

.card-footer div {
    display: flex;
    flex-direction: column;
}

.card-footer span:first-child {
    color: var(--cinza-texto);
}

.card-footer span:last-child {
    font-weight: bold;
    font-size: 1.1em;
    margin-top: 2px;
}

.rodape-tv {
    text-align: center;
    color: var(--cinza-texto);
    font-size: 12px;
    margin-top: 20px;
}

/* ==========================================
   ESTILOS - TELAS DE ANIVERSARIANTES
   ========================================== */
.intro-aniversarios {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
    border-radius: 24px;
    color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
}

.intro-aniversarios h2 {
    font-size: clamp(36px, 5vw, 70px);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 5px 20px rgba(0,0,0,0.5);
    animation: pulse 2s infinite alternate;
}

.intro-aniversarios p {
    font-size: clamp(20px, 2.5vw, 36px);
    margin-top: 20px;
    color: var(--amarelo);
    font-weight: bold;
}

@keyframes pulse {
    0% { transform: scale(0.98); }
    100% { transform: scale(1.03); }
}

.balao {
    position: absolute;
    bottom: -100px;
    width: 50px;
    height: 70px;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    animation: subir 6s infinite linear;
    opacity: 0.6;
}

@keyframes subir {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(-1000px) rotate(20deg); opacity: 0; }
}

.aniversariantes-container {
    max-width: 1400px;
    margin: auto;
    width: 100%;
    background: var(--azul-card);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
}

.aniversariantes-header {
    text-align: center;
    background: linear-gradient(90deg, #e63946, #d62828);
    color: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 30px;
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 4px 20px rgba(230,57,70,0.4);
}

.grid-meses {
    display: flex;
    justify-content: center;
}

.card-mes {
    background: rgba(0,0,0,0.2);
    border-radius: 16px;
    overflow: hidden;
    width: 100%;
    max-width: 800px;
    border: 1px solid rgba(255,255,255,0.08);
}

.card-mes-topo {
    padding: 16px;
    text-align: center;
    color: white;
    font-weight: bold;
    font-size: 1.5em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.05);
    letter-spacing: 1px;
}

.card-mes-corpo {
    padding: 20px;
    max-height: 60vh;
    overflow-y: auto;
}

.aniversariante-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    font-size: clamp(16px, 1.2vw, 22px);
}

.aniversariante-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.aniversariante-foto {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--cyan);
    background-color: #222;
    flex-shrink: 0;
}

.aniversariante-item .nome { font-weight: 600; color: var(--branco); }
.aniversariante-item .dia { color: var(--cyan); font-weight: bold; white-space: nowrap; }

.fullscreen-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    z-index: 9999;
}
.fullscreen-button:hover { background: rgba(255,255,255,0.2); }
</style>
</head>

<body>

<div class="indicador-telas">
    <div class="ponto ativo"></div>
    <div class="ponto"></div>
    <div class="ponto"></div>
</div>

<!-- TELA 1: RECUPERAÇÃO (LAYOUT SIMPLIFICADO & DINÂMICO PARA TV) -->
<div class="tela ativa" id="tela1">
    <div class="header-tv">
        <h1>Acompanhamento de Recuperação</h1>
        <div class="sub">
            <div>Data: <span id="dataAtual">--/--/----</span></div>
            <div>Faltam <span id="diasRestantes">--</span> dias úteis</div>
        </div>
    </div>

    <div class="dashboard-grid" id="cardsContainer">
        <!-- Cards gerados via JS dinamicamente -->
    </div>

    <div class="rodape-tv">
        Atualizado automaticamente • <span id="ultimaAtualizacao"></span>
    </div>
</div>

<!-- TELA 2: INTRO ANIVERSARIANTES -->
<div class="tela" id="tela2">
    <div class="intro-aniversarios">
        <div class="balao" style="left: 10%; background: #e63946; animation-delay: 0s;"></div>
        <div class="balao" style="left: 25%; background: #ffb703; animation-delay: 1.5s;"></div>
        <div class="balao" style="left: 40%; background: #00f5d4; animation-delay: 0.5s;"></div>
        <div class="balao" style="left: 60%; background: #2ec4b6; animation-delay: 2s;"></div>
        <div class="balao" style="left: 75%; background: #e0aaff; animation-delay: 1s;"></div>
        <div class="balao" style="left: 90%; background: #3a86ff; animation-delay: 2.5s;"></div>

        <h2>🎈 Aniversariantes 🎈</h2>
        <p id="textoMesAniversario">Confira quem celebra este mês!</p>
    </div>
</div>

<!-- TELA 3: LISTA ANIVERSARIANTES -->
<div class="tela" id="tela3">
    <div class="aniversariantes-container">
        <div class="aniversariantes-header">
            🎂 Aniversariantes do Mês
        </div>
        <div class="grid-meses" id="gridAniversariantes"></div>
    </div>
</div>

<button class="fullscreen-button" onclick="telaCheia()">⛶ Tela cheia</button>

<script>

/* =========================================================================
   1. APENAS ATUALIZE ESTE BLOCO DE DADOS (DADOS DE ENTRADA)
   ========================================================================= */
const dadosEntrada = [
    { faixa: "60 dias",  meta: 3500, realizado: 1591, projecao: 3053 },
    { faixa: "90 dias",  meta: 2500, realizado: 882,  projecao: 2440 },
    { faixa: "120 dias", meta: 1200, realizado: 494,  projecao: 1190 }
];

/* =========================================================================
   2. LISTA DE ANIVERSARIANTES
   ========================================================================= */
const FOTO_PADRAO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%238892b0'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

const listaAniversariantes = [
    { nome: "Leyson Renan Batista de Oliveira", dia: "25/01", foto: "" },
    { nome: "Sara Barbosa Vilar", dia: "27/01", foto: "" },
    { nome: "Arlinda Maria Batista Neta Reis", dia: "26/02", foto: "" },
    { nome: "Alice Mariano Ramos", dia: "23/03", foto: "" },
    { nome: "Luciana Fernandes Lacerda", dia: "10/04", foto: "" },
    { 
        nome: "Fernando Paulo dos Santos Pereira", 
        dia: "18/05", 
        foto: "https://media.licdn.com/dms/image/v2/D4D03AQFR92WyH72eQw/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1732812678925?e=1790812800&v=beta&t=PdNNXjNSD-KpI4vB1npypp0zStisqRSxeOnzOjbcXEc" 
    },
    { nome: "Daniela Vanessa Bianchi", dia: "22/05", foto: "" },
    { nome: "Ana Julia Camargo", dia: "04/06", foto: "" },
    { nome: "Tainara Livia Rocha", dia: "20/06", foto: "" },
    { nome: "Mariana Nunes Silva", dia: "12/07", foto: "" },
    { nome: "Bianca Vieira Vulcani", dia: "03/08", foto: "" },
    { nome: "Diego Correa dos Santos", dia: "17/08", foto: "" },
    { nome: "Sabatha Melissa Santana Novais", dia: "21/08", foto: "" },
    { nome: "Gabrielly dos Santos", dia: "25/08", foto: "" },
    { nome: "Geovana Pereira dos Santos", dia: "01/09", foto: "https://i.postimg.cc/fR7Pw5jF/GEOvana.jpg" },
    { nome: "João Victor Vitoriano da Silva", dia: "04/09", foto: "https://i.postimg.cc/kXbZH7V5/JOAO.jpg" },
    { nome: "Rafael Gustavo Angelotti Silva", dia: "16/09", foto: "https://i.postimg.cc/vTqQSbDt/angelotti.jpg" },
    { nome: "Jade Oliveira Franco da Silva", dia: "19/09", foto: "https://i.postimg.cc/4x5T8XMX/JADE.jpg" },
    { nome: "Karyna Cristina Meira Bento", dia: "24/09", foto: "https://i.postimg.cc/V63ySvSW/KARYNA-DESKTOP.jpg" },
    { nome: "Luiz Gustavo Damas da Silva", dia: "10/10", foto: "" },
    { nome: "Claudia Fernanda Pin de Mattos", dia: "16/10", foto: "" },
    { nome: "Rafael da Silva Batista Tolli", dia: "16/10", foto: "" },
    { nome: "Clara Marcelino da Silva", dia: "02/12", foto: "" },
    { nome: "Thierry Rodrigues Dias", dia: "19/12", foto: "" },
    { nome: "Amanda Cristina Aparecida Silva", dia: "21/12", foto: "" },
    { nome: "Maria Clara Vieira Caires", dia: "26/12", foto: "" }
];

/* =========================================================================
   3. LÓGICA DE CÁLCULO E RENDERIZAÇÃO DA TELA 1 (TV CARD LAYOUT)
   ========================================================================= */
function fmt(num) {
    return Number(num).toLocaleString('pt-BR');
}

function fmtPct(num) {
    const p = (num * 100).toFixed(0);
    return (p > 0 ? "+" : "") + p + "%";
}

function renderizarTela1() {
    const container = document.getElementById("cardsContainer");
    container.innerHTML = "";

    dadosEntrada.forEach(item => {
        // Cálculos Automáticos idênticos à planilha fornecida
        const realizadoPct = item.realizado / item.meta;
        const projecaoPct = item.projecao / item.meta;
        const saldoProj = item.projecao - item.meta;
        const saldoProjPct = saldoProj / item.meta;
        const saldo = item.realizado - item.meta;

        const card = document.createElement("div");
        card.className = "card-faixa";

        card.innerHTML = `
            <div class="card-header">
                <span class="titulo">${item.faixa}</span>
                <span class="meta-badge">Meta: <strong>${fmt(item.meta)}</strong></span>
            </div>

            <div class="metricas-grid">
                <div class="metrica-box">
                    <div class="rotulo">Realizado</div>
                    <div class="valor" style="color: var(--cyan);">${fmt(item.realizado)}</div>
                    <div class="pct status-negativo">${(realizadoPct * 100).toFixed(0)}%</div>
                </div>

                <div class="metrica-box">
                    <div class="rotulo">Projeção</div>
                    <div class="valor" style="color: var(--amarelo);">${fmt(item.projecao)}</div>
                    <div class="pct status-negativo">${(projecaoPct * 100).toFixed(0)}%</div>
                </div>
            </div>

            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Realizado</span>
                    <span>${(realizadoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg">
                    <div class="barra-fill realizado" style="width: ${Math.min(realizadoPct * 100, 100)}%;"></div>
                </div>
            </div>

            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Projeção</span>
                    <span>${(projecaoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg">
                    <div class="barra-fill projecao" style="width: ${Math.min(projecaoPct * 100, 100)}%;"></div>
                </div>
            </div>

            <div class="card-footer">
                <div>
                    <span>Saldo Proj.</span>
                    <span class="${saldoProj >= 0 ? 'status-positivo' : 'status-negativo'}">
                        ${fmt(saldoProj)} (${fmtPct(saldoProjPct)})
                    </span>
                </div>
                <div>
                    <span>Saldo Atual</span>
                    <span class="${saldo >= 0 ? 'status-positivo' : 'status-negativo'}">
                        ${fmt(saldo)}
                    </span>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

/* =========================================================================
   4. ROTAÇÃO DE TELAS & UTILITÁRIOS
   ========================================================================= */
const TEMPO_TROCA_SEGUNDOS = 12;
let telaAtual = 0;
const telas = document.querySelectorAll(".tela");
const pontos = document.querySelectorAll(".ponto");

function alternarTela() {
    telas[telaAtual].classList.remove("ativa");
    if(pontos[telaAtual]) pontos[telaAtual].classList.remove("ativo");

    telaAtual = (telaAtual + 1) % telas.length;

    telas[telaAtual].classList.add("ativa");
    if(pontos[telaAtual]) pontos[telaAtual].classList.add("ativo");
}

setInterval(alternarTela, TEMPO_TROCA_SEGUNDOS * 1000);

function atualizarData() {
    const hoje = new Date();
    document.getElementById("dataAtual").innerText = hoje.toLocaleDateString("pt-BR");

    const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    let diasRestantes = 0;

    for (let d = hoje.getDate() + 1; d <= ultimoDia.getDate(); d++) {
        const dia = new Date(hoje.getFullYear(), hoje.getMonth(), d);
        if (dia.getDay() !== 0 && dia.getDay() !== 6) diasRestantes++;
    }
    document.getElementById("diasRestantes").innerText = diasRestantes;

    const mesNome = hoje.toLocaleString("pt-BR", { month: "long" });
    document.getElementById("textoMesAniversario").innerText = `Aniversariantes de ${mesNome.toUpperCase()}!`;
}

function montarAniversariantes() {
    const grid = document.getElementById("gridAniversariantes");
    grid.innerHTML = "";

    const hoje = new Date();
    const mesAtualString = String(hoje.getMonth() + 1).padStart(2, "0");
    const mesNome = hoje.toLocaleString("pt-BR", { month: "long" }).toUpperCase();

    const doMes = listaAniversariantes.filter(p => {
        if (!p.dia || !p.dia.includes("/")) return false;
        const partes = p.dia.split("/");
        return partes[1].padStart(2, "0") === mesAtualString;
    });

    doMes.sort((a, b) => parseInt(a.dia.split("/")[0], 10) - parseInt(b.dia.split("/")[0], 10));

    const card = document.createElement("div");
    card.className = "card-mes";

    let htmlItens = "";
    doMes.forEach(p => {
        const urlFoto = (p.foto && p.foto.trim() !== "") ? p.foto : FOTO_PADRAO;
        htmlItens += `
            <div class="aniversariante-item">
                <div class="aniversariante-info">
                    <img src="${urlFoto}" class="aniversariante-foto" alt="${p.nome}" onerror="this.src='${FOTO_PADRAO}'">
                    <span class="nome">${p.nome}</span>
                </div>
                <span class="dia">${p.dia}</span>
            </div>
        `;
    });

    card.innerHTML = `
        <div class="card-mes-topo">${mesNome}</div>
        <div class="card-mes-corpo">
            ${htmlItens || "<p style='text-align:center;color:var(--cinza-texto);padding:20px;'>Nenhum aniversariante neste mês.</p>"}
        </div>
    `;

    grid.appendChild(card);
}

function telaCheia() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function init() {
    atualizarData();
    renderizarTela1();
    montarAniversariantes();
