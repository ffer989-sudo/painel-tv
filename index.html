<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento e Aniversariantes - TV</title>

<style>
:root {
    --azul-escuro: #0a192f;
    --azul-card: #112240;
    --azul-destaque: #0077b6;
    --cyan: #00f5d4;
    --verde: #2ec4b6;
    --vermelho: #e63946;
    --amarelo: #ffb703;
    --cinza-texto: #8892b0;
    --branco: #f8f9fa;

    /* TEMA ANIVERSARIANTES */
    --bg-aniv: #801313;
    --amarelo-aniv: #ffc82c;
    --laranja-aniv: #ff5722;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--azul-escuro);
    color: var(--branco);
    overflow: hidden;
}

/* ==========================================
   ROTAÇÃO E TRANSIÇÃO DE TELAS
   ========================================== */
.tela {
    display: none;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    padding: 20px;
    width: 100vw;
    height: 100vh;
}

.tela.ativa {
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 1;
}

.indicador-telas {
    position: fixed;
    top: 20px;
    right: 25px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
}

.ponto {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
}

.ponto.ativo {
    background: var(--amarelo-aniv);
    box-shadow: 0 0 10px var(--amarelo-aniv);
}

/* ==========================================
   ESTILOS - TELA 1 (DASHBOARD)
   ========================================== */
.header-tv { text-align: center; margin-bottom: 25px; }
.header-tv h1 {
    font-size: clamp(28px, 2.5vw, 44px);
    margin: 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-tv .sub {
    font-size: clamp(14px, 1.2vw, 22px);
    color: var(--cinza-texto);
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 30px;
}
.header-tv .sub span { color: var(--amarelo); font-weight: bold; }

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1700px;
    margin: 0 auto;
    width: 100%;
}

.card-faixa {
    background: var(--azul-card);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.card-faixa::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, var(--azul-destaque), var(--cyan));
}

.card-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; margin-bottom: 15px;
}
.card-header .titulo { font-size: clamp(22px, 1.8vw, 30px); font-weight: 800; color: var(--branco); }
.card-header .meta-badge { background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 12px; font-size: clamp(12px, 1vw, 16px); color: var(--cinza-texto); }
.card-header .meta-badge strong { color: var(--branco); }

.metricas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.metrica-box { background: rgba(0,0,0,0.25); padding: 15px; border-radius: 14px; text-align: center; }
.metrica-box .rotulo { font-size: clamp(11px, 0.85vw, 14px); color: var(--cinza-texto); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.metrica-box .valor { font-size: clamp(22px, 2vw, 34px); font-weight: 800; }
.metrica-box .pct { font-size: clamp(12px, 0.9vw, 16px); font-weight: bold; margin-top: 4px; }

.status-negativo { color: var(--vermelho); }
.status-positivo { color: var(--verde); }

.progresso-container { margin-bottom: 15px; }
.progresso-rotulo { display: flex; justify-content: space-between; font-size: clamp(11px, 0.85vw, 14px); color: var(--cinza-texto); margin-bottom: 6px; }
.barra-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
.barra-fill { height: 100%; border-radius: 10px; transition: width 1s ease-in-out; }
.barra-fill.realizado { background: linear-gradient(90deg, #3a86ff, #00f5d4); }
.barra-fill.projecao { background: linear-gradient(90deg, #ffb703, #fb8500); }

.card-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; font-size: clamp(11px, 0.85vw, 14px); }
.card-footer div { display: flex; flex-direction: column; }
.card-footer span:first-child { color: var(--cinza-texto); }
.card-footer span:last-child { font-weight: bold; font-size: 1.1em; margin-top: 2px; }

.rodape-tv { text-align: center; color: var(--cinza-texto); font-size: 12px; margin-top: 20px; }

/* ==========================================
   ESTILOS - TELA DE ANIVERSARIANTES
   ========================================== */
.tela-aniversario {
    background-color: var(--bg-aniv);
    background-image: 
        radial-gradient(circle at 10% 20%, #ff5722 4px, transparent 5px),
        radial-gradient(circle at 90% 15%, #ffc82c 6px, transparent 7px),
        radial-gradient(circle at 85% 80%, #ffffff 5px, transparent 6px),
        radial-gradient(circle at 15% 85%, #ffc82c 5px, transparent 6px);
    background-size: 180px 180px, 220px 220px, 150px 150px, 200px 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 25px 30px;
    height: 100vh;
}

.intro-cartaz { justify-content: center; text-align: center; }
.intro-cartaz h2 {
    font-size: clamp(40px, 5vw, 75px);
    color: var(--amarelo-aniv);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 0;
    text-shadow: 3px 3px 0px #000;
}
.intro-cartaz p {
    font-size: clamp(22px, 2.5vw, 40px);
    color: #fff;
    font-weight: 700;
    margin-top: 15px;
}

/* CABEÇALHO ANIVERSARIANTES DO MÊS */
.aniv-banner-header { text-align: center; margin-bottom: 5px; }

.aniv-titulo-principal {
    font-size: clamp(32px, 3.8vw, 52px);
    font-weight: 900;
    color: var(--amarelo-aniv);
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 2px 2px 0px #000;
    letter-spacing: 1px;
    margin: 0;
}

.aniv-sub-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 8px;
}

.aniv-titulo-mes {
    font-size: clamp(26px, 3vw, 42px);
    font-weight: 900;
    color: var(--amarelo-aniv);
    text-transform: uppercase;
    text-shadow: 2px 2px 0px #000;
}

/* GRID DE CARDS COM FOTO */
.aniv-grid-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 20px 30px;
    max-width: 1400px;
    width: 100%;
    margin: auto 0;
}

.aniv-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: clamp(160px, 14vw, 210px);
}

.aniv-foto-frame {
    width: 100%;
    height: clamp(160px, 14vw, 210px);
    border-radius: 18px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    border: 3px solid #fff;
}

.aniv-foto-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.aniv-tag-nome {
    background: var(--amarelo-aniv);
    color: #111;
    font-weight: 800;
    font-size: clamp(12px, 1vw, 15px);
    padding: 6px 10px;
    border-radius: 20px;
    text-align: center;
    margin-top: -14px;
    z-index: 2;
    width: 95%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

.aniv-tag-dia {
    background: var(--laranja-aniv);
    color: #fff;
    font-weight: 900;
    font-size: clamp(12px, 1vw, 15px);
    padding: 4px 16px;
    border-radius: 12px;
    margin-top: -8px;
    z-index: 3;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

/* RODAPÉ MENSAGEM */
.aniv-rodape-mensagem {
    text-align: center;
    color: #ffffff;
    margin-top: 5px;
}

.aniv-rodape-mensagem .p1 { font-size: clamp(16px, 1.3vw, 22px); font-weight: 700; margin: 0; }
.aniv-rodape-mensagem .p2 {
    font-size: clamp(18px, 1.5vw, 26px);
    font-weight: 900;
    margin: 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    color: var(--amarelo-aniv);
}

.aniv-sem-dados {
    font-size: 24px;
    color: #fff;
    text-align: center;
    background: rgba(0,0,0,0.3);
    padding: 20px 40px;
    border-radius: 16px;
}

.fullscreen-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    z-index: 9999;
}
</style>
</head>

<body>

<div class="indicador-telas">
    <div class="ponto ativo"></div>
    <div class="ponto"></div>
    <div class="ponto"></div>
</div>

<!-- TELA 1: RECUPERAÇÃO -->
<div class="tela ativa" id="tela1">
    <div class="header-tv">
        <h1>Acompanhamento de Recuperação</h1>
        <div class="sub">
            <div>Data: <span id="dataAtual">--/--/----</span></div>
            <div>Faltam <span id="diasRestantes">--</span> dias úteis</div>
        </div>
    </div>

    <div class="dashboard-grid" id="cardsContainer"></div>

    <div class="rodape-tv">
        Atualizado automaticamente • <span id="ultimaAtualizacao"></span>
    </div>
</div>

<!-- TELA 2: INTRO ANIVERSARIANTES -->
<div class="tela tela-aniversario intro-cartaz" id="tela2">
    <div>
        <h2>🎈 ANIVERSARIANTES 🎈</h2>
        <p id="textoMesAniversario">CONFIRA OS ANIVERSARIANTES DO MÊS!</p>
    </div>
</div>

<!-- TELA 3: PAINEL ANIVERSARIANTES -->
<div class="tela tela-aniversario" id="tela3">
    
    <div class="aniv-banner-header">
        <h1 class="aniv-titulo-principal">ANIVERSARIANTES</h1>
        <div class="aniv-sub-header">
            <span class="aniv-titulo-mes" id="tituloMesPainel">DO MÊS</span>
        </div>
    </div>

    <div class="aniv-grid-cards" id="gridAniversariantes"></div>

    <div class="aniv-rodape-mensagem">
        <p class="p1">Que este novo ciclo seja repleto de realizações.</p>
        <p class="p2">Feliz Aniversário! 🎉</p>
    </div>

</div>

<button class="fullscreen-button" onclick="telaCheia()">⛶ Tela cheia</button>

<script>

/* =========================================================================
   1. DADOS DE ENTRADA (DASHBOARD)
   ========================================================================= */
const dadosEntrada = [
    { faixa: "60 dias",  meta: 3500, realizado: 1591, projecao: 3053 },
    { faixa: "90 dias",  meta: 2500, realizado: 882,  projecao: 2440 },
    { faixa: "120 dias", meta: 1200, realizado: 494,  projecao: 1190 }
];

/* =========================================================================
   2. LISTA COMPLETA DE ANIVERSARIANTES
   ========================================================================= */
const FOTO_PADRAO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23ffffff'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

const listaAniversariantes = [
    { nome: "Leyson Renan", dia: "25/01", foto: "" },
    { nome: "Sara Barbosa", dia: "27/01", foto: "" },
    { nome: "Arlinda Maria", dia: "26/02", foto: "" },
    { nome: "Alice Mariano", dia: "23/03", foto: "" },
    { nome: "Luciana Fernandes", dia: "10/04", foto: "" },
    { 
        nome: "Fernando Santos", 
        dia: "18/05", 
        foto: "https://media.licdn.com/dms/image/v2/D4D03AQFR92WyH72eQw/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1732812678925?e=1790812800&v=beta&t=PdNNXjNSD-KpI4vB1npypp0zStisqRSxeOnzOjbcXEc" 
    },
    { nome: "Daniela Bianchi", dia: "22/05", foto: "" },
    { nome: "Ana Julia Camargo", dia: "04/06", foto: "" },
    { nome: "Tainara Livia", dia: "20/06", foto: "" },
    { nome: "Mariana Nunes", dia: "12/07", foto: "" },
    { nome: "Bianca Vulcani", dia: "03/08", foto: "" },
    { nome: "Diego Correa", dia: "17/08", foto: "" },
    { nome: "Sabatha Santana", dia: "21/08", foto: "" },
    { nome: "Gabrielly Santos", dia: "25/08", foto: "" },
    { nome: "Geovana Santos", dia: "01/09", foto: "https://i.postimg.cc/fR7Pw5jF/GEOvana.jpg" },
    { nome: "João Victor", dia: "04/09", foto: "https://i.postimg.cc/kXbZH7V5/JOAO.jpg" },
    { nome: "Rafael Angelotti", dia: "16/09", foto: "https://i.postimg.cc/vTqQSbDt/angelotti.jpg" },
    { nome: "Jade Franco", dia: "19/09", foto: "https://i.postimg.cc/4x5T8XMX/JADE.jpg" },
    { nome: "Karyna Meira", dia: "24/09", foto: "https://i.postimg.cc/V63ySvSW/KARYNA-DESKTOP.jpg" },
    { nome: "Luiz Gustavo", dia: "10/10", foto: "" },
    { nome: "Claudia Mattos", dia: "16/10", foto: "" },
    { nome: "Rafael Tolli", dia: "16/10", foto: "" },
    { nome: "Clara Marcelino", dia: "02/12", foto: "" },
    { nome: "Thierry Rodrigues", dia: "19/12", foto: "" },
    { nome: "Amanda Silva", dia: "21/12", foto: "" },
    { nome: "Maria Clara", dia: "26/12", foto: "" }
];

/* =========================================================================
   3. CÁLCULO E RENDERIZAÇÃO TELA 1
   ========================================================================= */
function fmt(num) { return Number(num).toLocaleString('pt-BR'); }
function fmtPct(num) {
    const p = (num * 100).toFixed(0);
    return (p > 0 ? "+" : "") + p + "%";
}

function renderizarTela1() {
    const container = document.getElementById("cardsContainer");
    if (!container) return;
    container.innerHTML = "";

    dadosEntrada.forEach(item => {
        const realizadoPct = item.realizado / item.meta;
        const projecaoPct = item.projecao / item.meta;
        const saldoProj = item.projecao - item.meta;
        const saldoProjPct = saldoProj / item.meta;
        const saldo = item.realizado - item.meta;

        const card = document.createElement("div");
        card.className = "card-faixa";
        card.innerHTML = `
            <div class="card-header">
                <span class="titulo">${item.faixa}</span>
                <span class="meta-badge">Meta: <strong>${fmt(item.meta)}</strong></span>
            </div>
            <div class="metricas-grid">
                <div class="metrica-box">
                    <div class="rotulo">Realizado</div>
                    <div class="valor" style="color: var(--cyan);">${fmt(item.realizado)}</div>
                    <div class="pct status-negativo">${(realizadoPct * 100).toFixed(0)}%</div>
                </div>
                <div class="metrica-box">
                    <div class="rotulo">Projeção</div>
                    <div class="valor" style="color: var(--amarelo);">${fmt(item.projecao)}</div>
                    <div class="pct status-negativo">${(projecaoPct * 100).toFixed(0)}%</div>
                </div>
            </div>
            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Realizado</span>
                    <span>${(realizadoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg"><div class="barra-fill realizado" style="width: ${Math.min(realizadoPct * 100, 100)}%;"></div></div>
            </div>
            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Projeção</span>
                    <span>${(projecaoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg"><div class="barra-fill projecao" style="width: ${Math.min(projecaoPct * 100, 100)}%;"></div></div>
            </div>
            <div class="card-footer">
                <div>
                    <span>Saldo Proj.</span>
                    <span class="${saldoProj >= 0 ? 'status-positivo' : 'status-negativo'}">${fmt(saldoProj)} (${fmtPct(saldoProjPct)})</span>
                </div>
                <div>
                    <span>Saldo Atual</span>
                    <span class="${saldo >= 0 ? 'status-positivo' : 'status-negativo'}">${fmt(saldo)}</span>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

/* =========================================================================
   4. RENDERIZAÇÃO PROTEGIDA DOS ANIVERSARIANTES
   ========================================================================= */
function montarAniversariantes() {
    const grid = document.getElementById("gridAniversariantes");
    if (!grid) return;
    grid.innerHTML = "";

    const hoje = new Date();
    const mesAtualNum = hoje.getMonth() + 1;
    let mesNome = hoje.toLocaleString("pt-BR", { month: "long" }).toUpperCase();

    // Filtro seguro tratando nulos e formatos inválidos
    let doMes = listaAniversariantes.filter(p => {
        if (!p || !p.dia || typeof p.dia !== 'string' || !p.dia.includes("/")) return false;
        const partes = p.dia.split("/");
        const mesItem = parseInt(partes[1], 10);
        return mesItem === mesAtualNum;
    });

    // Se o mês atual não tiver aniversariantes cadastrados, mostra mensagem amigável sem quebrar o layout
    if (doMes.length === 0) {
        document.getElementById("tituloMesPainel").innerText = `DE ${mesNome}`;
        document.getElementById("textoMesAniversario").innerText = `ANIVERSARIANTES DE ${mesNome}!`;
        grid.innerHTML = `<div class="aniv-sem-dados">Nenhum aniversariante cadastrado em ${mesNome}.</div>`;
        return;
    }

    document.getElementById("tituloMesPainel").innerText = `DE ${mesNome}`;
    document.getElementById("textoMesAniversario").innerText = `ANIVERSARIANTES DE ${mesNome}!`;

    doMes.sort((a, b) => parseInt(a.dia.split("/")[0], 10) - parseInt(b.dia.split("/")[0], 10));

    doMes.forEach(p => {
        const urlFoto = (p.foto && typeof p.foto === 'string' && p.foto.trim() !== "") ? p.foto : FOTO_PADRAO;
        const card = document.createElement("div");
        card.className = "aniv-card";
        card.innerHTML = `
            <div class="aniv-foto-frame">
                <img src="${urlFoto}" alt="${p.nome}" onerror="this.src='${FOTO_PADRAO}'">
            </div>
            <div class="aniv-tag-nome">${p.nome}</div>
            <div class="aniv-tag-dia">${p.dia}</div>
        `;
        grid.appendChild(card);
    });
}

/* =========================================================================
   5. ROTAÇÃO DE TELAS
   ========================================================================= */
const TEMPO_TROCA_SEGUNDOS = 12;
let telaAtual = 0;
const telas = document.querySelectorAll(".tela");
const pontos = document.querySelectorAll(".ponto");

function alternarTela() {
    if (telas.length === 0) return;
    telas[telaAtual].classList.remove("ativa");
    if(pontos[telaAtual]) pontos[telaAtual].classList.remove("ativo");

    telaAtual = (telaAtual + 1) % telas.length;

    telas[telaAtual].classList.add("ativa");
    if(pontos[telaAtual]) pontos[telaAtual].classList.add("ativo");
}

setInterval(alternarTela, TEMPO_TROCA_SEGUNDOS * 1000);

function atualizarData() {
    const hoje = new Date();
    const elData = document.getElementById("dataAtual");
    if (elData) elData.innerText = hoje.toLocaleDateString("pt-BR");

    const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    let diasRestantes = 0;

    for (let d = hoje.getDate() + 1; d <= ultimoDia.getDate(); d++) {
        const dia = new Date(hoje.getFullYear(), hoje.getMonth(), d);
        if (dia.getDay() !== 0 && dia.getDay() !== 6) diasRestantes++;
    }
    const elDias = document.getElementById("diasRestantes");
    if (elDias) elDias.innerText = diasRestantes;
}

function telaCheia() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function init() {
    atualizarData();
    renderizarTela1();
    montarAniversariantes();
    const elAtt = document.getElementById("ultimaAtualizacao");
    if (elAtt) elAtt.innerText = new Date().toLocaleTimeString("pt-BR");
}

window.onload = init;

</script>

</body>
</html>
