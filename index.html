<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento e Aniversariantes - TV</title>

<style>
:root {
    --azul-escuro: #0a192f;
    --azul-card: #112240;
    --azul-hover: #1d3557;
    --azul-destaque: #0077b6;
    --cyan: #00f5d4;
    --verde: #2ec4b6;
    --vermelho: #e63946;
    --amarelo: #ffb703;
    --cinza-texto: #8892b0;
    --branco: #f8f9fa;

    /* CORES TEMA CARTAZ ANIVERSÁRIO */
    --bg-aniv: #801313;
    --amarelo-aniv: #ffc82c;
    --laranja-aniv: #ff5722;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--azul-escuro);
    color: var(--branco);
    overflow: hidden;
}

/* ==========================================
   ROTAÇÃO E TRANSIÇÃO DE TELAS
   ========================================== */
.tela {
    display: none;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    padding: 20px;
    width: 100vw;
    height: 100vh;
}

.tela.ativa {
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 1;
}

.indicador-telas {
    position: fixed;
    top: 20px;
    right: 25px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
}

.ponto {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s ease;
}

.ponto.ativo {
    background: var(--amarelo-aniv);
    box-shadow: 0 0 10px var(--amarelo-aniv);
}

/* ==========================================
   ESTILOS - TELA 1 (DASHBOARD RECUPERAÇÃO)
   ========================================== */
.header-tv { text-align: center; margin-bottom: 25px; }
.header-tv h1 {
    font-size: clamp(28px, 2.5vw, 44px);
    margin: 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header-tv .sub {
    font-size: clamp(14px, 1.2vw, 22px);
    color: var(--cinza-texto);
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 30px;
}
.header-tv .sub span { color: var(--amarelo); font-weight: bold; }

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1700px;
    margin: 0 auto;
    width: 100%;
}

.card-faixa {
    background: var(--azul-card);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.card-faixa::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 6px;
    background: linear-gradient(90deg, var(--azul-destaque), var(--cyan));
}

.card-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; margin-bottom: 15px;
}
.card-header .titulo { font-size: clamp(22px, 1.8vw, 30px); font-weight: 800; color: var(--branco); }
.card-header .meta-badge { background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 12px; font-size: clamp(12px, 1vw, 16px); color: var(--cinza-texto); }
.card-header .meta-badge strong { color: var(--branco); }

.metricas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.metrica-box { background: rgba(0,0,0,0.25); padding: 15px; border-radius: 14px; text-align: center; }
.metrica-box .rotulo { font-size: clamp(11px, 0.85vw, 14px); color: var(--cinza-texto); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.metrica-box .valor { font-size: clamp(22px, 2vw, 34px); font-weight: 800; }
.metrica-box .pct { font-size: clamp(12px, 0.9vw, 16px); font-weight: bold; margin-top: 4px; }

.status-negativo { color: var(--vermelho); }
.status-positivo { color: var(--verde); }

.progresso-container { margin-bottom: 15px; }
.progresso-rotulo { display: flex; justify-content: space-between; font-size: clamp(11px, 0.85vw, 14px); color: var(--cinza-texto); margin-bottom: 6px; }
.barra-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
.barra-fill { height: 100%; border-radius: 10px; transition: width 1s ease-in-out; }
.barra-fill.realizado { background: linear-gradient(90deg, #3a86ff, #00f5d4); }
.barra-fill.projecao { background: linear-gradient(90deg, #ffb703, #fb8500); }

.card-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; font-size: clamp(11px, 0.85vw, 14px); }
.card-footer div { display: flex; flex-direction: column; }
.card-footer span:first-child { color: var(--cinza-texto); }
.card-footer span:last-child { font-weight: bold; font-size: 1.1em; margin-top: 2px; }

.rodape-tv { text-align: center; color: var(--cinza-texto); font-size: 12px; margin-top: 20px; }

/* ==========================================
   ESTILOS - TELAS DE ANIVERSARIANTES (NOVO LAYOUT MODELO IMPRESSO/TV)
   ========================================== */

/* TELAS DE ANIVERSÁRIO COM CONFETI DE FUNDO */
.tela-aniversario {
    background-color: var(--bg-aniv);
    background-image: 
        radial-gradient(circle at 10% 20%, #ff5722 4px, transparent 5px),
        radial-gradient(circle at 90% 15%, #ffc82c 6px, transparent 7px),
        radial-gradient(circle at 85% 80%, #ffffff 5px, transparent 6px),
        radial-gradient(circle at 15% 85%, #ffc82c 5px, transparent 6px),
        linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.05) 25%, transparent 25%);
    background-size: 180px 180px, 220px 220px, 150px 150px, 200px 200px, 60px 60px, 60px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 30px 40px;
    height: 100vh;
}

.intro-cartaz {
    justify-content: center;
    text-align: center;
}

.intro-cartaz h2 {
    font-size: clamp(40px, 5vw, 75px);
    color: var(--amarelo-aniv);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin: 0;
    text-shadow: 3px 3px 0px #000;
}

.intro-cartaz p {
    font-size: clamp(22px, 2.5vw, 40px);
    color: #fff;
    font-weight: 700;
    margin-top: 15px;
}

/* CABEÇALHO DO PAINEL */
.aniv-banner-header {
    text-align: center;
    margin-bottom: 10px;
}

.aniv-titulo-principal {
    font-size: clamp(32px, 3.8vw, 54px);
    font-weight: 900;
    color: var(--amarelo-aniv);
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 2px 2px 0px #000;
    letter-spacing: 1px;
    margin: 0;
}

.aniv-sub-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
}

.aniv-titulo-mes {
    font-size: clamp(26px, 3vw, 44px);
    font-weight: 900;
    color: var(--amarelo-aniv);
    text-transform: uppercase;
    text-shadow: 2px 2px 0px #000;
}

.aniv-icones-caixa {
    background: var(--amarelo-aniv);
    padding: 4px 12px;
    border-radius: 8px;
    display: flex;
    gap: 12px;
    align-items: center;
    border: 2px solid #000;
    box-shadow: 3px 3px 0 #000;
}

.aniv-icones-caixa svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: #1a237e;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* GRID DE CARDS DOS ANIVERSARIANTES */
.aniv-grid-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 25px 35px;
    max-width: 1400px;
    width: 100%;
    margin: auto 0;
}

.aniv-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: clamp(180px, 16vw, 240px);
}

.aniv-foto-frame {
    width: 100%;
    height: clamp(180px, 16vw, 240px);
    border-radius: 18px;
    overflow: hidden;
    background: #e0e0e0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    border: 3px solid #fff;
}

.aniv-foto-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ETIQUETA COM NOME E DIA */
.aniv-tag-nome {
    background: var(--amarelo-aniv);
    color: #111;
    font-weight: 800;
    font-size: clamp(13px, 1.1vw, 17px);
    padding: 6px 14px;
    border-radius: 20px;
    text-align: center;
    margin-top: -14px;
    z-index: 2;
    width: 92%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

.aniv-tag-dia {
    background: var(--laranja-aniv);
    color: #fff;
    font-weight: 900;
    font-size: clamp(13px, 1.1vw, 17px);
    padding: 4px 16px;
    border-radius: 12px;
    margin-top: -8px;
    z-index: 3;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    letter-spacing: 0.5px;
}

/* RODAPÉ DO CARTAZ */
.aniv-rodape-mensagem {
    text-align: center;
    color: #ffffff;
    margin-top: 10px;
}

.aniv-rodape-mensagem .p1 {
    font-size: clamp(16px, 1.5vw, 24px);
    font-weight: 700;
    margin: 0;
}

.aniv-rodape-mensagem .p2 {
    font-size: clamp(18px, 1.8vw, 28px);
    font-weight: 900;
    margin: 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.aniv-linha-detalhe {
    display: inline-block;
    width: 80px;
    height: 2px;
    background: var(--amarelo-aniv);
    vertical-align: middle;
}

.fullscreen-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    z-index: 9999;
}
.fullscreen-button:hover { background: rgba(0,0,0,0.8); }
</style>
</head>

<body>

<div class="indicador-telas">
    <div class="ponto ativo"></div>
    <div class="ponto"></div>
    <div class="ponto"></div>
</div>

<!-- TELA 1: RECUPERAÇÃO -->
<div class="tela ativa" id="tela1">
    <div class="header-tv">
        <h1>Acompanhamento de Recuperação</h1>
        <div class="sub">
            <div>Data: <span id="dataAtual">--/--/----</span></div>
            <div>Faltam <span id="diasRestantes">--</span> dias úteis</div>
        </div>
    </div>

    <div class="dashboard-grid" id="cardsContainer"></div>

    <div class="rodape-tv">
        Atualizado automaticamente • <span id="ultimaAtualizacao"></span>
    </div>
</div>

<!-- TELA 2: INTRO ANIVERSARIANTES -->
<div class="tela tela-aniversario intro-cartaz" id="tela2">
    <div>
        <h2>🎈 ANIVERSARIANTES 🎈</h2>
        <p id="textoMesAniversario">CONFIRA OS ANIVERSARIANTES DO MÊS!</p>
    </div>
</div>

<!-- TELA 3: PAINEL ANIVERSARIANTES (LAYOUT FIEL AO MODELO SOLICITADO) -->
<div class="tela tela-aniversario" id="tela3">
    
    <div class="aniv-banner-header">
        <h1 class="aniv-titulo-principal">ANIVERSARIANTES</h1>
        <div class="aniv-sub-header">
            <span class="aniv-titulo-mes">DO MÊS</span>
            <div class="aniv-icones-caixa">
                <!-- Ícone Bolo -->
                <svg viewBox="0 0 24 24"><path d="M20 21H4a2 2 0 0 1-2-2v-2h20v2a2 2 0 0 1-2 2zM2 15h20v-3a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v3zm10-9a2 2 0 0 0 2-2 2 2 0 0 0-4 0 2 2 0 0 0 2 2z"/></svg>
                <!-- Ícone Chapéu -->
                <svg viewBox="0 0 24 24"><path d="M6 21l6-18 6 18H6zM12 3v.01"/></svg>
                <!-- Ícone Balões -->
                <svg viewBox="0 0 24 24"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 0v10M7 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 0v8"/></svg>
            </div>
        </div>
    </div>

    <!-- CARDS DOS ANIVERSARIANTES (RENDERIZADOS DINAMICAMENTE CONFORME O MÊS ATUAL) -->
    <div class="aniv-grid-cards" id="gridAniversariantes"></div>

    <div class="aniv-rodape-mensagem">
        <p class="p1">Que este novo ciclo seja repleto de realizações.</p>
        <p class="p2">
            <span class="aniv-linha-detalhe"></span>
            Feliz Aniversário!
            <span class="aniv-linha-detalhe"></span>
        </p>
    </div>

</div>

<button class="fullscreen-button" onclick="telaCheia()">⛶ Tela cheia</button>

<script>

/* =========================================================================
   1. DADOS DA TELA 1 (RECUPERAÇÃO)
   ========================================================================= */
const dadosEntrada = [
    { faixa: "60 dias",  meta: 3500, realizado: 1591, projecao: 3053 },
    { faixa: "90 dias",  meta: 2500, realizado: 882,  projecao: 2440 },
    { faixa: "120 dias", meta: 1200, realizado: 494,  projecao: 1190 }
];

/* =========================================================================
   2. LISTA DE ANIVERSARIANTES (COM APELIDOS/PRIMEIRO NOME FORMATADOS)
   ========================================================================= */
const FOTO_PADRAO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 24 24' fill='%23999999'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

const listaAniversariantes = [
    { nome: "Leyson Renan", dia: "25/01", foto: "" },
    { nome: "Sara Vilar", dia: "27/01", foto: "" },
    { nome: "Arlinda Neta", dia: "26/02", foto: "" },
    { nome: "Alice Ramos", dia: "23/03", foto: "" },
    { nome: "Luciana Lacerda", dia: "10/04", foto: "" },
    { 
        nome: "Fernando Pereira", 
        dia: "18/05", 
        foto: "https://media.licdn.com/dms/image/v2/D4D03AQFR92WyH72eQw/profile-displayphoto-shrink_400_400/profile-displayphoto-shrink_400_400/0/1732812678925?e=1790812800&v=beta&t=PdNNXjNSD-KpI4vB1npypp0zStisqRSxeOnzOjbcXEc" 
    },
    { nome: "Daniela Bianchi", dia: "22/05", foto: "" },
    { nome: "Ana Julia Camargo", dia: "04/06", foto: "" },
    { nome: "Tainara Rocha", dia: "20/06", foto: "" },
    { nome: "Mariana Silva", dia: "12/07", foto: "" },
    { nome: "Bianca Vulcani", dia: "03/08", foto: "" },
    { nome: "Diego Santos", dia: "17/08", foto: "" },
    { nome: "Sabatha Novais", dia: "21/08", foto: "" },
    { nome: "Gabrielly Santos", dia: "25/08", foto: "" },
    { nome: "Geovana Santos", dia: "01/09", foto: "" },
    { nome: "João Victor", dia: "04/09", foto: "" },
    { nome: "Rafael Angelotti", dia: "16/09", foto: "" },
    { nome: "Jade Franco", dia: "19/09", foto: "" },
    { nome: "Karyna Meira", dia: "24/09", foto: "" },
    { nome: "Luiz Gustavo", dia: "10/10", foto: "" },
    { nome: "Claudia Mattos", dia: "16/10", foto: "" },
    { nome: "Rafael Tolli", dia: "16/10", foto: "" },
    { nome: "Clara Silva", dia: "02/12", foto: "" },
    { nome: "Thierry Dias", dia: "19/12", foto: "" },
    { nome: "Amanda Silva", dia: "21/12", foto: "" },
    { nome: "Maria Clara Caires", dia: "26/12", foto: "" }
];

/* =========================================================================
   3. RENDERIZAÇÃO DA TELA 1 (DASHBOARD)
   ========================================================================= */
function fmt(num) { return Number(num).toLocaleString('pt-BR'); }
function fmtPct(num) {
    const p = (num * 100).toFixed(0);
    return (p > 0 ? "+" : "") + p + "%";
}

function renderizarTela1() {
    const container = document.getElementById("cardsContainer");
    container.innerHTML = "";

    dadosEntrada.forEach(item => {
        const realizadoPct = item.realizado / item.meta;
        const projecaoPct = item.projecao / item.meta;
        const saldoProj = item.projecao - item.meta;
        const saldoProjPct = saldoProj / item.meta;
        const saldo = item.realizado - item.meta;

        const card = document.createElement("div");
        card.className = "card-faixa";

        card.innerHTML = `
            <div class="card-header">
                <span class="titulo">${item.faixa}</span>
                <span class="meta-badge">Meta: <strong>${fmt(item.meta)}</strong></span>
            </div>

            <div class="metricas-grid">
                <div class="metrica-box">
                    <div class="rotulo">Realizado</div>
                    <div class="valor" style="color: var(--cyan);">${fmt(item.realizado)}</div>
                    <div class="pct status-negativo">${(realizadoPct * 100).toFixed(0)}%</div>
                </div>

                <div class="metrica-box">
                    <div class="rotulo">Projeção</div>
                    <div class="valor" style="color: var(--amarelo);">${fmt(item.projecao)}</div>
                    <div class="pct status-negativo">${(projecaoPct * 100).toFixed(0)}%</div>
                </div>
            </div>

            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Realizado</span>
                    <span>${(realizadoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg">
                    <div class="barra-fill realizado" style="width: ${Math.min(realizadoPct * 100, 100)}%;"></div>
                </div>
            </div>

            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Projeção</span>
                    <span>${(projecaoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg">
                    <div class="barra-fill projecao" style="width: ${Math.min(projecaoPct * 100, 100)}%;"></div>
                </div>
            </div>

            <div class="card-footer">
                <div>
                    <span>Saldo Proj.</span>
                    <span class="${saldoProj >= 0 ? 'status-positivo' : 'status-negativo'}">
                        ${fmt(saldoProj)} (${fmtPct(saldoProjPct)})
                    </span>
                </div>
                <div>
                    <span>Saldo Atual</span>
                    <span class="${saldo >= 0 ? 'status-positivo' : 'status-negativo'}">
                        ${fmt(saldo)}
                    </span>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

/* =========================================================================
   4. RENDERIZAÇÃO DA TELA DE ANIVERSARIANTES (FORMATO MODELO SOLICITADO)
   ========================================================================= */
function montarAniversariantes() {
    const grid = document.getElementById("gridAniversariantes");
    grid.innerHTML = "";

    const hoje = new Date();
    const mesAtualString = String(hoje.getMonth() + 1).padStart(2, "0");

    // Filtra pessoas do mês vigente
    const doMes = listaAniversariantes.filter(p => {
        if (!p.dia || !p.dia.includes("/")) return false;
        const partes = p.dia.split("/");
        return partes[1].padStart(2, "0") === mesAtualString;
    });

    // Ordena do menor dia para o maior
    doMes.sort((a, b) => parseInt(a.dia.split("/")[0], 10) - parseInt(b.dia.split("/")[0], 10));

    if (doMes.length === 0) {
        grid.innerHTML = `<p style="font-size: 24px; font-weight: bold; color: #fff;">Nenhum aniversariante registrado neste mês.</p>`;
        return;
    }

    doMes.forEach(p => {
        const urlFoto = (p.foto && p.foto.trim() !== "") ? p.foto : FOTO_PADRAO;

        const card = document.createElement("div");
        card.className = "aniv-card";

        card.innerHTML = `
            <div class="aniv-foto-frame">
                <img src="${urlFoto}" alt="${p.nome}" onerror="this.src='${FOTO_PADRAO}'">
            </div>
            <div class="aniv-tag-nome">${p.nome}</div>
            <div class="aniv-tag-dia">${p.dia}</div>
        `;

        grid.appendChild(card);
    });
}

/* =========================================================================
   5. ROTAÇÃO DE TELAS & UTILITÁRIOS
   ========================================================================= */
const TEMPO_TROCA_SEGUNDOS = 12;
let telaAtual = 0;
const telas = document.querySelectorAll(".tela");
const pontos = document.querySelectorAll(".ponto");

function alternarTela() {
    telas[telaAtual].classList.remove("ativa");
    if(pontos[telaAtual]) pontos[telaAtual].classList.remove("ativo");

    telaAtual = (telaAtual + 1) % telas.length;

    telas[telaAtual].classList.add("ativa");
    if(pontos[telaAtual]) pontos[telaAtual].classList.add("ativo");
}

setInterval(alternarTela, TEMPO_TROCA_SEGUNDOS * 1000);

function atualizarData() {
    const hoje = new Date();
    document.getElementById("dataAtual").innerText = hoje.toLocaleDateString("pt-BR");

    const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    let diasRestantes = 0;

    for (let d = hoje.getDate() + 1; d <= ultimoDia.getDate(); d++) {
        const dia = new Date(hoje.getFullYear(), hoje.getMonth(), d);
        if (dia.getDay() !== 0 && dia.getDay() !== 6) diasRestantes++;
    }
    document.getElementById("diasRestantes").innerText = diasRestantes;

    const mesNome = hoje.toLocaleString("pt-BR", { month: "long" }).toUpperCase();
    document.getElementById("textoMesAniversario").innerText = `CONFIRA OS ANIVERSARIANTES DE ${mesNome}!`;
}

function telaCheia() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

function init() {
    atualizarData();
    renderizarTela1();
    montarAniversariantes();
    document.getElementById("ultimaAtualizacao").innerText = new Date().toLocaleTimeString("pt-BR");
}

init();

</script>
