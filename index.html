<style>
:root {
    --azul-escuro: #0a192f;
    --azul-card: #112240;
    --azul-hover: #1d3557;
    --azul-destaque: #0077b6;
    --cyan: #00f5d4;
    --verde: #2ec4b6;
    --vermelho: #e63946;
    --amarelo: #ffb703;
    --cinza-texto: #8892b0;
    --branco: #f8f9fa;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--azul-escuro);
    color: var(--branco);
    overflow: hidden;
}

/* LOGO FIXA EM HTML/CSS PURO NO RODAPÉ */
.logo-empresa-fixa {
    position: fixed;
    bottom: 20px;
    left: 25px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(17, 34, 64, 0.7);
    backdrop-filter: blur(12px);
    padding: 8px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
}

.logo-icon-svg {
    width: 30px;
    height: 24px;
    fill: #FFB800;
}

.logo-texto {
    font-family: 'Arial Black', Gadget, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 22px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
}

.logo-texto .parte-vermelha { color: #E30613; }
.logo-texto .parte-amarela { color: #FFB800; }

/* ==========================================
   ROTAÇÃO E TRANSIÇÃO DE TELAS
   ========================================== */
.tela {
    display: none;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    padding: 20px;
    width: 100vw;
    height: 100vh;
}

.tela.ativa {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 1;
}

.indicador-telas {
    position: fixed;
    top: 20px;
    right: 25px;
    display: flex;
    gap: 10px;
    z-index: 9999;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
}

.ponto {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
}

.ponto.ativo {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
}

/* ==========================================
   ESTILOS - TELA 1 (DASHBOARD REDESENHADO)
   ========================================== */
.header-tv {
    text-align: center;
    margin-bottom: 25px;
}

.header-tv h1 {
    font-size: clamp(28px, 2.5vw, 44px);
    margin: 0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header-tv .sub {
    font-size: clamp(14px, 1.2vw, 22px);
    color: var(--cinza-texto);
    margin-top: 8px;
    display: flex;
    justify-content: center;
    gap: 30px;
}

.header-tv .sub span {
    color: var(--amarelo);
    font-weight: bold;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1700px;
    margin: 0 auto;
    width: 100%;
}

.card-faixa {
    background: var(--azul-card);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
}

.card-faixa::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, var(--azul-destaque), var(--cyan));
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 12px;
    margin-bottom: 15px;
}

.card-header .titulo {
    font-size: clamp(22px, 1.8vw, 30px);
    font-weight: 800;
    color: var(--branco);
}

.card-header .meta-badge {
    background: rgba(255,255,255,0.06);
    padding: 6px 14px;
    border-radius: 12px;
    font-size: clamp(12px, 1vw, 16px);
    color: var(--cinza-texto);
}

.card-header .meta-badge strong {
    color: var(--branco);
}

.metricas-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
}

.metrica-box {
    background: rgba(0,0,0,0.25);
    padding: 15px;
    border-radius: 14px;
    text-align: center;
}

.metrica-box .rotulo {
    font-size: clamp(11px, 0.85vw, 14px);
    color: var(--cinza-texto);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}

.metrica-box .valor {
    font-size: clamp(22px, 2vw, 34px);
    font-weight: 800;
}

.metrica-box .pct {
    font-size: clamp(12px, 0.9vw, 16px);
    font-weight: bold;
    margin-top: 4px;
}

.status-negativo { color: var(--vermelho); }
.status-positivo { color: var(--verde); }

.progresso-container {
    margin-bottom: 15px;
}

.progresso-rotulo {
    display: flex;
    justify-content: space-between;
    font-size: clamp(11px, 0.85vw, 14px);
    color: var(--cinza-texto);
    margin-bottom: 6px;
}

.barra-bg {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
}

.barra-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 1s ease-in-out;
}

.barra-fill.realizado { background: linear-gradient(90deg, #3a86ff, #00f5d4); }
.barra-fill.projecao-amarela { background: linear-gradient(90deg, #ffb703, #fb8500); }
.barra-fill.projecao-verde { background: linear-gradient(90deg, #2a9d8f, #2ec4b6); }

.card-footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    padding: 12px;
    border-radius: 12px;
    font-size: clamp(11px, 0.85vw, 14px);
}

.card-footer div {
    display: flex;
    flex-direction: column;
}

.card-footer span:first-child {
    color: var(--cinza-texto);
}

.card-footer span:last-child {
    font-weight: bold;
    font-size: 1.1em;
    margin-top: 2px;
}

.rodape-tv {
    text-align: center;
    color: var(--cinza-texto);
    font-size: 12px;
    margin-top: 20px;
}

/* ==========================================
   ESTILOS - TELA 2 & TELA 3 (ANIVERSARIANTES)
   ========================================== */
.intro-aniversarios {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
    border-radius: 24px;
    color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
}

.intro-aniversarios h2 {
    font-size: clamp(36px, 5vw, 70px);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 5px 20px rgba(0,0,0,0.5);
    animation: pulse 2s infinite alternate;
}

.intro-aniversarios p {
    font-size: clamp(20px, 2.5vw, 36px);
    margin-top: 20px;
    color: var(--amarelo);
    font-weight: bold;
    animation: flutuarTexto 3s infinite ease-in-out;
}

@keyframes pulse {
    0% { transform: scale(0.98); }
    100% { transform: scale(1.03); }
}

@keyframes flutuarTexto {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.balao {
    position: absolute;
    bottom: -100px;
    width: 50px;
    height: 70px;
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    animation: subir 6s infinite linear;
    opacity: 0.4;
    pointer-events: none;
}

@keyframes subir {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
    100% { transform: translateY(-1000px) rotate(20deg); opacity: 0; }
}

/* TELA 3 COM O MESMO FUNDO, BALÕES E ANIMAÇÃO DE PULSAÇÃO MAIOR */
.aniversariantes-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 20px;
}

.aniversariantes-container {
    max-width: 1400px;
    margin: auto;
    width: 100%;
    background: rgba(17, 34, 64, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 30px 40px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 2;
    animation: pulseContainer 3s infinite ease-in-out;
}

@keyframes pulseContainer {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
}

.aniversariantes-header {
    text-align: center;
    background: linear-gradient(90deg, #e63946, #d62828);
    color: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 25px;
    font-size: clamp(26px, 3vw, 42px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 4px 20px rgba(230,57,70,0.4);
}

.grid-meses {
    display: flex;
    justify-content: center;
}

.card-mes {
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    overflow: hidden;
    width: 100%;
    max-width: 1200px;
    border: 1px solid rgba(255,255,255,0.08);
}

.card-mes-topo {
    padding: 16px;
    text-align: center;
    color: var(--amarelo);
    font-weight: bold;
    font-size: clamp(18px, 1.6vw, 26px);
    text-transform: uppercase;
    background: rgba(255,255,255,0.05);
    letter-spacing: 1.5px;
}

.card-mes-corpo {
    padding: 20px;
    max-height: 56vh;
    overflow-y: auto;
}

.aniversariante-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    font-size: clamp(18px, 1.6vw, 26px);
    transition: transform 0.3s ease, background 0.3s ease;
}

.aniversariante-item:hover {
    background: rgba(255,255,255,0.09);
    transform: translateX(5px);
}

.aniversariante-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.aniversariante-foto {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--cyan);
    background-color: #222;
    flex-shrink: 0;
}

.aniversariante-item .nome { font-weight: 600; color: var(--branco); }
.aniversariante-item .dia { color: var(--cyan); font-weight: bold; white-space: nowrap; }

/* ==========================================
   ESTILOS - TELAS DINÂMICAS DE IMAGENS / BRINDES
   ========================================== */
.container-imagem-brinde {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    gap: 15px;
}

.titulo-imagem-brinde {
    font-size: clamp(22px, 2.5vw, 36px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--amarelo);
    text-align: center;
    background: rgba(0, 0, 0, 0.4);
    padding: 10px 25px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    white-space: pre-line;
}

.img-brinde-midia {
    width: 100%;
    max-width: 96vw;
    max-height: 85vh;
    border-radius: 18px;
    object-fit: contain;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    border: 2px solid rgba(255, 255, 255, 0.1);
}

.fullscreen-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    z-index: 9999;
}
.fullscreen-button:hover { background: rgba(255,255,255,0.2); }
</style>

        const divTela = document.createElement("div");
        divTela.className = "tela";
        divTela.id = `telaBrinde_${idx}`;

        divTela.innerHTML = `
            <div class="container-imagem-brinde">
                ${imgObj.titulo ? `<div class="titulo-imagem-brinde">${imgObj.titulo}</div>` : ''}
                <img src="${imgObj.src}" class="img-brinde-midia" alt="${imgObj.titulo || 'Imagem Brinde'}">
            </div>
        `;
        containerTelas.appendChild(divTela);
    });
}

/* =========================================================================
   4. RENDERIZAÇÃO DA TELA 1 (RECUPERAÇÃO)
   ========================================================================= */
function fmt(num) {
    return Number(num).toLocaleString('pt-BR');
}

function fmtPct(num) {
    const p = (num * 100).toFixed(0);
    return (p > 0 ? "+" : "") + p + "%";
}

function renderizarTela1() {
    const container = document.getElementById("cardsContainer");
    container.innerHTML = "";

    dadosEntrada.forEach(item => {
        const realizadoPct = item.realizado / item.meta;
        const projecaoPct = item.projecao / item.meta;
        const saldoProj = item.projecao - item.meta;
        const saldoProjPct = saldoProj / item.meta;
        const saldo = item.realizado - item.meta;

        const bateuMetaProj = projecaoPct >= 1;
        const classeBarraProj = bateuMetaProj ? "projecao-verde" : "projecao-amarela";
        const corTextoProj = bateuMetaProj ? "var(--verde)" : "var(--amarelo)";

        const card = document.createElement("div");
        card.className = "card-faixa";

        card.innerHTML = `
            <div class="card-header">
                <span class="titulo">${item.faixa}</span>
                <span class="meta-badge">Meta: <strong>${fmt(item.meta)}</strong></span>
            </div>

            <div class="metricas-grid">
                <div class="metrica-box">
                    <div class="rotulo">Realizado</div>
                    <div class="valor" style="color: var(--cyan);">${fmt(item.realizado)}</div>
                    <div class="pct status-negativo">${(realizadoPct * 100).toFixed(0)}%</div>
                </div>

                <div class="metrica-box">
                    <div class="rotulo">Projeção</div>
                    <div class="valor" style="color: ${corTextoProj};">${fmt(item.projecao)}</div>
                    <div class="pct" style="color: ${corTextoProj};">${(projecaoPct * 100).toFixed(0)}%</div>
                </div>
            </div>

            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Realizado</span>
                    <span>${(realizadoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg">
                    <div class="barra-fill realizado" style="width: ${Math.min(realizadoPct * 100, 100)}%;"></div>
                </div>
            </div>

            <div class="progresso-container">
                <div class="progresso-rotulo">
                    <span>Progresso Projeção</span>
                    <span style="color: ${corTextoProj}; font-weight: bold;">${(projecaoPct * 100).toFixed(0)}%</span>
                </div>
                <div class="barra-bg">
                    <div class="barra-fill ${classeBarraProj}" style="width: ${Math.min(projecaoPct * 100, 100)}%;"></div>
                </div>
            </div>

            <div class="card-footer">
                <div>
                    <span>Saldo Proj.</span>
                    <span class="${saldoProj >= 0 ? 'status-positivo' : 'status-negativo'}">
                        ${fmt(saldoProj)} (${fmtPct(saldoProjPct)})
                    </span>
                </div>
                <div>
                    <span>Saldo Atual</span>
                    <span class="${saldo >= 0 ? 'status-positivo' : 'status-negativo'}">
                        ${fmt(saldo)}
                    </span>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

/* =========================================================================
   5. ROTAÇÃO DE TELAS & UTILITÁRIOS
   ========================================================================= */
const TEMPO_TROCA_SEGUNDOS = 20;
let telaAtual = 0;
let telas = [];
let pontos = [];

function criarIndicadores() {
    telas = document.querySelectorAll(".tela");
    const containerIndicadores = document.getElementById("indicadorTelas");
    containerIndicadores.innerHTML = "";

    telas.forEach((_, i) => {
        const ponto = document.createElement("div");
        ponto.className = `ponto ${i === 0 ? 'ativo' : ''}`;
        containerIndicadores.appendChild(ponto);
    });

    pontos = document.querySelectorAll(".ponto");
}

function alternarTela() {
    if (telas.length === 0) return;

    telas[telaAtual].classList.remove("ativa");
    if (pontos[telaAtual]) pontos[telaAtual].classList.remove("ativo");

    telaAtual = (telaAtual + 1) % telas.length;

    telas[telaAtual].classList.add("ativa");
    if (pontos[telaAtual]) pontos[telaAtual].classList.add("ativo");
}

setInterval(alternarTela, TEMPO_TROCA_SEGUNDOS * 1000);

function atualizarData() {
    const hoje = new Date();
    document.getElementById("dataAtual").innerText = hoje.toLocaleDateString("pt-BR");

    const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    let diasRestantes = 0;

    for (let d = hoje.getDate() + 1; d <= ultimoDia.getDate(); d++) {
        const dia = new Date(hoje.getFullYear(), hoje.getMonth(), d);
        if (dia.getDay() !== 0 && dia.getDay() !== 6) diasRestantes++;
    }
    document.getElementById("diasRestantes").innerText = diasRestantes;

    const mesNome = hoje.toLocaleString("pt-BR", { month: "long" });
    document.getElementById("textoMesAniversario").innerText = `Aniversariantes de ${mesNome.toUpperCase()}!`;
}

function montarAniversariantes() {
    const grid = document.getElementById("gridAniversariantes");
    grid.innerHTML = "";

    const hoje = new Date();
    const mesAtualString = String(hoje.getMonth() + 1).padStart(2, "0");
    const mesNome = hoje.toLocaleString("pt-BR", { month: "long" }).toUpperCase();

    const doMes = listaAniversariantes.filter(p => {
        if (!p.dia || !p.dia.includes("/")) return false;
        const partes = p.dia.split("/");
        return partes[1].padStart(2, "0") === mesAtualString;
    });

    doMes.sort((a, b) => parseInt(a.dia.split("/")[0], 10) - parseInt(b.dia.split("/")[0], 10));

    const card = document.createElement("div");
    card.className = "card-mes";

    let htmlItens = "";
    doMes.forEach(p => {
        const urlFoto = (p.foto && p.foto.trim() !== "") ? p.foto : FOTO_PADRAO;
        htmlItens += `
            <div class="aniversariante-item">
                <div class="aniversariante-info">
                    <img src="${urlFoto}" class="aniversariante-foto" alt="${p.nome}" onerror="this.src='${FOTO_PADRAO}'">
                    <span class="nome">${p.nome}</span>
                </div>
                <span class="dia">${p.dia}</span>
            </div>
        `;
    });

    card.innerHTML = `
        <div class="card-mes-topo">${mesNome}</div>
        <div class="card-mes-corpo">
            ${htmlItens || "<p style='text-align:center;color:var(--cinza-texto);padding:20px;'>Nenhum aniversariante neste mês.</p>"}
        </div>
    `;

    grid.appendChild(card);
}

function telaCheia() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
}

/* =========================================================================
   6. AUTO-RELOAD DA TELA A CADA 1 HORA (3.600.000 ms)
   ========================================================================= */
setInterval(() => {
    window.location.reload(true);
}, 60 * 60 * 1000);

function init() {
    atualizarData();
    renderizarTela1();
    montarAniversariantes();
    gerarTelasImagens();
    criarIndicadores();
    document.getElementById("ultimaAtualizacao").innerText = new Date().toLocaleTimeString("pt-BR");
}

init();

</script>
